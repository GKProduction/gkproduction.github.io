<!-- Просмотр страницы игры -->
<!DOCTYPE html>
<html>

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="referrer" content="strict-origin-when-cross-origin">
		
		<title>GKProduction Game</title>
		
		<!-- Open Graph -->
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="GKProduction Game">
		<meta property="og:title" content="GKProduction Game">
		<meta property="og:description" content="Some of GKProduction games">
		<meta property="og:url" content="https://gkproduction.github.io/game">
		<meta property="og:image" content="https://gkproduction.github.io/images/gkproduction.png">

		<link rel="stylesheet" href="main_styles.css">
	</head>

	<body>
		<!-- Страница игры -->
		<div class="game-page">
			
			<!-- Логотип -->
			<div class="page-block logo-block"></div>
			
			<!-- Скриншоты -->
			<div class="page-block gallery-block"></div>
			
			<!-- Играть сейчас -->
			<div class="page-block game-links-block"></div>

			<!-- Описание -->
			<div class="page-block description-block"></div>
			
			<!-- Исходный код -->
			<div class="page-block source-links-block"></div>
			
			<!-- Сообщество -->
			<div class="page-block community-links-block"></div>
			
			<!-- Поддержка -->
			<div class="page-block donate-links-block"></div>
			
			<!-- Копирайт -->
			<div class="page-block copyright-block"></div>
			
		</div>
		
		<!-- Markdown -->
		<script src="../scripts/marked.js"></script>
		
		<!-- Локализация текста -->
		<script src="../scripts/languages.js"></script>
		
		<!-- Скрипт для отображения страницы игры -->
		<script src="scripts/game_page.js"></script>
		
	</body>
	
</html>
